<div class="crypto-box-animated">
    <div class="crypto-title">⚡ Швидкий донат в USDT</div>
    <div class="network">Переказуйте виключно токени <strong>USD&amp;t</strong> у мережі <strong>TON</strong></div>
    
    <div class="address-wrapper">
        <div class="address-field" id="crypto-address">UQC-UPDrsGaPvUjh6c-XQ_CyJjHfmtR_XFjpP89sUyihUge5</div>
        <button class="copy-btn-neon" onclick="copyAddress()" id="copy-button">Копіювати</button>
    </div>
</div>

<style>
    /* Базовый контейнер с постоянной мягкой пульсацией */
    .crypto-box-animated {
        background: #151c2c;
        padding: 24px;
        border-radius: 16px;
        border: 1px solid #242f47;
        margin-bottom: 32px;
        text-align: left;
        position: relative;
        box-shadow: 0 0 15px rgba(16, 185, 129, 0.03);
        animation: boxPulse 3s infinite ease-in-out;
    }

    /* Анимация пульсации для всего блока */
    @keyframes boxPulse {
        0% { border-color: #242f47; box-shadow: 0 0 15px rgba(16, 185, 129, 0.03); }
        50% { border-color: rgba(16, 185, 129, 0.4); box-shadow: 0 0 25px rgba(16, 185, 129, 0.15); }
        100% { border-color: #242f47; box-shadow: 0 0 15px rgba(16, 185, 129, 0.03); }
    }

    .crypto-title {
        font-weight: 700;
        color: #f3f4f6;
        margin-bottom: 6px;
        font-size: 1.1rem;
    }

    .network {
        font-size: 0.85rem;
        color: #9ca3af;
        margin-bottom: 16px;
    }

    .network strong {
        color: #10b981;
    }

    .address-wrapper {
        display: flex;
        gap: 10px;
    }

    .address-field {
        flex: 1;
        background: #1a2030;
        padding: 14px 16px;
        border-radius: 10px;
        font-family: monospace;
        font-size: 0.9rem;
        word-break: break-all;
        color: #e5e7eb;
        border: 1px solid #242f47;
        transition: all 0.3s ease;
    }

    /* Интерактивная неоновая кнопка */
    .copy-btn-neon {
        background: #10b981;
        color: #000000;
        border: none;
        padding: 0 24px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 0.9rem;
        cursor: pointer;
        white-space: nowrap;
        /* Плавность для всех эффектов */
        transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), 
                    background-color 0.2s ease, 
                    box-shadow 0.2s ease;
    }

    /* Эффект при наведении на кнопку */
    .copy-btn-neon:hover {
        background: #34d399;
        transform: translateY(-2px);
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
    }

    /* Эффект физического клика */
    .copy-btn-neon:active {
        transform: translateY(1px) scale(0.97);
        box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
    }

    @media (max-width: 480px) {
        .address-wrapper { flex-direction: column; }
        .copy-btn-neon { padding: 14px; }
    }
</style>

<script>
    function copyAddress() {
        const addressText = document.getElementById('crypto-address').innerText;
        navigator.clipboard.writeText(addressText).then(() => {
            const btn = document.getElementById('copy-button');
            
            // Анимация успешного копирования
            btn.innerText = '✓ Скопійовано';
            btn.style.background = '#ffffff';
            btn.style.color = '#000000';
            btn.style.boxShadow = '0 0 25px rgba(255, 255, 255, 0.7)';
            
            setTimeout(() => {
                btn.innerText = 'Копіювати';
                btn.style.background = '#10b981';
                btn.style.color = '#000000';
                btn.style.boxShadow = 'none';
            }, 2000);
        });
    }
</script>
